<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación | Regula T</title>
    <link rel="icon" type="image/png" href="img/logoo.png">
    <link rel="stylesheet" href="css/style_.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">Regula <span>T.</span></a>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="cursos.html">Cursos</a>
        <a href="evaluacion.html" class="active">Evaluación</a>
        <a href="progreso.html">Mi progreso</a>
        <a href="nosotros.html">Nosotros</a>
    </nav>
</header>

<main class="page-container">
    <section class="page-heading">
        <span class="etiqueta">CONOZCAMOS TU FORMA DE APRENDER</span>
        <h1>Evaluación inicial</h1>
        <p>Responde estas preguntas para recibir una recomendación.</p>
    </section>

    <form id="formEvaluacion" class="card form-card">

        <label for="nombre">¿Cómo te llamas?</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label for="grado">¿Qué grado de secundaria cursas?</label>
        <select id="grado" required>
            <option value="">Selecciona tu grado</option>
            <option value="1°">Primero</option>
            <option value="2°">Segundo</option>
            <option value="3°">Tercero</option>
        </select>

        <label for="materia">¿Qué materia se te dificulta más?</label>
        <select id="materia" required>
            <option value="">Selecciona una materia</option>
            <option value="matematicas">Matemáticas</option>
            <option value="espanol">Español</option>
            <option value="ciencias">Ciencias</option>
            <option value="ingles">Inglés</option>
        </select>

        <label for="metodo">¿Cómo prefieres aprender?</label>
        <select id="metodo" required>
            <option value="">Elige una opción</option>
            <option value="videos">Videos y clases grabadas</option>
            <option value="lectura">Lecturas y explicaciones</option>
            <option value="practica">Ejercicios y cuestionarios</option>
        </select>

        <label for="tiempo">¿Cuánto tiempo puedes estudiar al día?</label>
        <select id="tiempo" required>
            <option value="">Selecciona el tiempo</option>
            <option value="15 minutos">15 minutos</option>
            <option value="30 minutos">30 minutos</option>
            <option value="1 hora">1 hora o más</option>
        </select>

        <button type="submit" class="btn">
            Obtener recomendación
        </button>
    </form>

    <section id="resultadoEvaluacion" class="card result-card" hidden>
        <h2>¡Tu recomendación está lista!</h2>
        <div id="textoRecomendacion"></div>
        <a href="cursos.html" class="btn">Explorar cursos</a>
    </section>
</main>

<footer>
    <p>© 2026 Regula T | Proyecto Laboral</p>
</footer>

</body>
</html>
